<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- JS Script -->
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator">
        <div id="display"></div>
        <div id="buttons">
            <button class="number btn btn-secondary">1</button>
            <button class="number btn btn-secondary">2</button>
            <button class="number btn btn-secondary">3</button>
            <button class="operator btn btn-warning">+</button>

            <button class="number btn btn-secondary">4</button>
            <button class="number btn btn-secondary">5</button>
            <button class="number btn btn-secondary">6</button>
            <button class="operator btn btn-warning">-</button>

            <button class="number btn btn-secondary">7</button>
            <button class="number btn btn-secondary">8</button>
            <button class="number btn btn-secondary">9</button>
            <button class="operator btn btn-warning">*</button>

            <button id="dot" class="btn btn-secondary">.</button>
            <button class="number btn btn-secondary">0</button>
            <button id="backspace" class="btn btn-outline-light">⌫</button>
            <button class="operator btn btn-warning">/</button>

            <button id="clear" class="btn btn-danger">Clear</button>
            <button id="equal" class="btn btn-success">=</button>
        </div>
    </div>

    <!-- Bootstrap JS (optional, harmless to keep) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
